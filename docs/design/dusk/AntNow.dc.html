<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Antigua · Now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0E0F14}
a{color:#F4EFE8}a:hover{color:#FFFFFF}
button{font:inherit}
.gt{color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;background-size:100% 100%,cover;-webkit-text-stroke:1px rgba(255,255,255,0.42);filter:drop-shadow(0 2px 10px rgba(0,0,0,0.3))}
.gt-arch{background-image:linear-gradient(180deg,rgba(255,255,255,0.6) 0%,rgba(255,255,255,0.2) 60%,rgba(255,255,255,0.04) 100%),url("/_blob/e07ffa6d588f21409103744fee42dc5c");background-position:0 0,50% 52%}
.gt-calle{background-image:linear-gradient(180deg,rgba(255,255,255,0.6) 0%,rgba(255,255,255,0.2) 60%,rgba(255,255,255,0.04) 100%),url("/_blob/7a7f52d14f496ed8705f3254f808525c");background-position:0 0,50% 62%}
.gt-plaza{background-image:linear-gradient(180deg,rgba(255,255,255,0.6) 0%,rgba(255,255,255,0.2) 60%,rgba(255,255,255,0.04) 100%),url("/_blob/476fae81fd92b5571a990f2e4e44eefb");background-position:0 0,50% 66%}
.gt-night{background-image:linear-gradient(180deg,rgba(255,255,255,0.62) 0%,rgba(255,255,255,0.24) 60%,rgba(255,255,255,0.06) 100%),url("/_blob/2617045653937f3eec5bbd625add1256");background-position:0 0,50% 64%}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E0F14; color: #F4EFE8; font-family: 'Manrope', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 330px; overflow: hidden;">
    <img src="/_blob/20e5d8519ccc422c95a6e965e297de13" alt="" style="{{hero.arch}}">
    <img src="/_blob/0a0e60ea147ad02e6096116acf978f65" alt="" style="{{hero.calle}}">
    <img src="/_blob/8034d3eab7e754fa8e7dc88de1330b8a" alt="" style="{{hero.plaza}}">
    <img src="/_blob/84d7059ed3bf03931ea9e99c9f5b7273" alt="" style="{{hero.night}}">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,15,20,0.5) 0%, rgba(14,15,20,0.1) 38%, rgba(14,15,20,0.05) 60%, #0E0F14 100%);"></div>
  </div>

  <header style="position: absolute; left: 22px; right: 22px; top: 56px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 1px 12px rgba(0,0,0,0.45);">Antigua <span style="font-size: 15px; font-weight: 500;">· day 2 of 4</span></span>
    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%); backdrop-filter: blur(8px) saturate(180%); -webkit-backdrop-filter: blur(8px) saturate(180%); border: 1px solid rgba(255,255,255,0.26); box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), inset 1px 0 0 rgba(255,140,140,0.14), inset -1px 0 0 rgba(140,190,255,0.16), 0 6px 18px rgba(0,0,0,0.25);"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 8px 2px rgba(255,255,255,0.7);"></span>Offline</span>
  </header>
  <div style="position: absolute; left: 22px; top: 96px; text-shadow: 0 1px 16px rgba(0,0,0,0.5);">
    <div style="font-size: 64px; font-weight: 300; letter-spacing: -0.05em; line-height: 1;">{{clock}}</div>
    <div style="font-size: 14px; font-weight: 700; margin-top: 4px;">{{weather}}</div>
  </div>
  <div role="radiogroup" aria-label="Time of day" style="position: absolute; left: 16px; right: 16px; top: 262px; display: flex; gap: 6px;">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <section aria-label="Right now" style="position: absolute; left: 12px; right: 12px; top: 318px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <a href="AntPlace.dc.html" style="position: relative; display: block; height: 140px; border-radius: 28px; overflow: hidden; text-decoration: none; color: #F4EFE8; background: #1A1B22; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 10px 30px rgba(0,0,0,0.35);">
        <sc-if value="{{c.isArch}}" hint-placeholder-val="{{false}}"><img src="/_blob/20e5d8519ccc422c95a6e965e297de13" alt="" style="{{c.imgStyle}}"></sc-if>
        <sc-if value="{{c.isCalle}}" hint-placeholder-val="{{false}}"><img src="/_blob/0a0e60ea147ad02e6096116acf978f65" alt="" style="{{c.imgStyle}}"></sc-if>
        <sc-if value="{{c.isPlaza}}" hint-placeholder-val="{{false}}"><img src="/_blob/8034d3eab7e754fa8e7dc88de1330b8a" alt="" style="{{c.imgStyle}}"></sc-if>
        <sc-if value="{{c.isNight}}" hint-placeholder-val="{{false}}"><img src="/_blob/84d7059ed3bf03931ea9e99c9f5b7273" alt="" style="{{c.imgStyle}}"></sc-if>
        <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,15,20,0.55) 0%, rgba(14,15,20,0.08) 45%, rgba(14,15,20,0.42) 100%);"></span>
        <span style="position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%); backdrop-filter: blur(6px) saturate(180%); -webkit-backdrop-filter: blur(6px) saturate(180%); border: 1px solid rgba(255,255,255,0.28); box-shadow: inset 0 1px 1px rgba(255,255,255,0.65), inset 1px 0 0 rgba(255,140,140,0.16), inset -1px 0 0 rgba(140,190,255,0.18);">{{c.walk}}</span>
        <span style="position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.16) 35%, rgba(255,255,255,0.06) 70%); backdrop-filter: blur(6px) saturate(180%); -webkit-backdrop-filter: blur(6px) saturate(180%); border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.7);">{{c.num}}</span>
        <span style="position: absolute; left: 16px; right: 56px; top: 50px; font-size: 14px; line-height: 1.35; font-weight: 600; text-shadow: 0 1px 10px rgba(0,0,0,0.7);">{{c.why}}</span>
        <span class="{{c.glassClass}}" style="{{c.nameStyle}}">{{c.name}}</span>
      </a>
    </sc-for>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px; background: linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 100%); backdrop-filter: blur(10px) saturate(190%); -webkit-backdrop-filter: blur(10px) saturate(190%); border: 1px solid rgba(255,255,255,0.24); box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -1px 1px rgba(255,255,255,0.1), inset 1px 0 0 rgba(255,140,140,0.14), inset -1px 0 0 rgba(140,190,255,0.16), 0 12px 32px rgba(0,0,0,0.4);">
    <a href="#" aria-current="page" style="text-decoration: none; padding: 13px 16px; border-radius: 999px; color: #FFFFFF; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.18); box-shadow: inset 0 1px 1px rgba(255,255,255,0.55);">Now</a>
    <a href="AntMap.dc.html" style="text-decoration: none; padding: 13px 14px; color: #E4DCD2; font-size: 13px; font-weight: 600;">Map</a>
    <a href="AntSetup.dc.html" style="text-decoration: none; padding: 13px 14px; color: #E4DCD2; font-size: 13px; font-weight: 600;">Plan</a>
    <a href="AntTalk.dc.html" style="text-decoration: none; padding: 13px 14px; color: #E4DCD2; font-size: 13px; font-weight: 600;">Talk</a>
    <button type="button" aria-label="Ask your buddy" style="width: 46px; height: 46px; border-radius: 50%; color: #FFFFFF; display: grid; place-items: center; cursor: pointer; background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.28) 24%, rgba(255,255,255,0.1) 58%, rgba(255,255,255,0.2) 100%); border: 1px solid rgba(255,255,255,0.5); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -3px 8px rgba(255,255,255,0.18), inset 1px 0 0 rgba(255,140,140,0.22), inset -1px 0 0 rgba(140,190,255,0.24), 0 6px 18px rgba(0,0,0,0.35);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'midday' }; }
  renderVals() {
    var self = this;
    var crop = { arch: '50% 52%', calle: '50% 62%', plaza: '50% 66%', night: '50% 64%' };
    var heroCrop = { arch: '50% 32%', calle: '50% 42%', plaza: '50% 46%', night: '50% 52%' };
    var M = {
      midday: { label: 'Midday', clock: '12:00', weather: '24° · clear until 15:00', hero: 'arch', cards: [
        ['Calle del Arco', 'calle', '5 min walk', 'The postcard view: the arch with the volcano behind it, while the sky is clear.'],
        ['Parque Central', 'plaza', '3 min walk', 'Shady benches facing the cathedral, three minutes away.'],
        ['Rooftop terrace', 'night', '7 min walk', 'Book now for sunset. Volcán de Agua faces the terrace.'] ] },
      afternoon: { label: 'Afternoon', clock: '15:00', weather: '22° · showers likely after 16:00', hero: 'calle', cards: [
        ['Santa Catalina Arch', 'arch', '4 min walk', 'See it before the showers. The yellow glows in this light.'],
        ['Parque Central', 'plaza', '3 min walk', 'Covered arcades on the south side if it rains.'],
        ['Rooftop terrace', 'night', '7 min walk', 'Showers clear by sunset. Worth a table at 18:00.'] ] },
      dusk: { label: 'Dusk', clock: '17:30', weather: '19° · sunset now', hero: 'plaza', cards: [
        ['Rooftop terrace', 'night', '7 min walk', 'The volcano turns blue right now. Seven minutes to the best view.'],
        ['Parque Central', 'plaza', '3 min walk', 'The cathedral is lit and the plaza fills with families.'],
        ['Calle del Arco', 'calle', '5 min walk', 'Restaurants under the arch are opening for dinner.'] ] },
      night: { label: 'Night', clock: '20:00', weather: '16° · clear night', hero: 'night', cards: [
        ['Calle del Arco', 'calle', '5 min walk', 'Dinner under the arch, away from the day crowds.'],
        ['Santa Catalina Arch', 'arch', '4 min walk', 'Quiet now. Good for a photo without people in it.'],
        ['Parque Central', 'plaza', '3 min walk', 'Close to your hotel, for a late walk.'] ] }
    };
    var cur = M[this.state.mode];
    var hero = {};
    ['arch', 'calle', 'plaza', 'night'].forEach(function (k) {
      hero[k] = 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: ' + heroCrop[k] + '; transition: opacity 600ms ease-out; opacity: ' + (k === cur.hero ? '1' : '0') + ';';
    });
    var base = 'flex: 1; height: 40px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 700; color: #FFFFFF; backdrop-filter: blur(8px) saturate(190%); -webkit-backdrop-filter: blur(8px) saturate(190%); text-shadow: 0 1px 2px rgba(0,0,0,0.35); transition: all 240ms ease-out; ';
    var clear = 'background: linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 100%); border: 1px solid rgba(255,255,255,0.24); box-shadow: inset 0 1px 1px rgba(255,255,255,0.55), inset 1px 0 0 rgba(255,140,140,0.14), inset -1px 0 0 rgba(140,190,255,0.16), 0 6px 16px rgba(0,0,0,0.22);';
    var prom = 'background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 100%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 1px rgba(255,255,255,1), inset 0 -2px 6px rgba(255,255,255,0.22), inset 1px 0 0 rgba(255,140,140,0.24), inset -1px 0 0 rgba(140,190,255,0.26), 0 8px 22px rgba(0,0,0,0.3); transform: scale(1.04);';
    var modes = ['midday', 'afternoon', 'dusk', 'night'].map(function (k) {
      var on = k === self.state.mode;
      return {
        label: M[k].label, checked: on ? 'true' : 'false',
        pick: function () { self.setState({ mode: k }); },
        style: base + (on ? prom : clear)
      };
    });
    var cards = cur.cards.map(function (c, i) {
      var size = c[0].length > 16 ? 46 : c[0].length > 13 ? 54 : 62;
      return {
        num: String(i + 1), name: c[0], walk: c[2], why: c[3],
        isArch: c[1] === 'arch', isCalle: c[1] === 'calle', isPlaza: c[1] === 'plaza', isNight: c[1] === 'night',
        imgStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: ' + crop[c[1]] + ';',
        glassClass: 'gt gt-' + c[1],
        nameStyle: 'position: absolute; left: 0; right: 0; top: 0; bottom: -' + Math.round(size * 0.2) + 'px; display: flex; align-items: flex-end; padding-left: 10px; font-size: ' + size + 'px; font-weight: 800; letter-spacing: -0.055em; line-height: 1; white-space: nowrap;'
      };
    });
    return { clock: cur.clock, weather: cur.weather, hero: hero, modes: modes, cards: cards };
  }
}
</script>
</body>
</html>
